# Für diese Stellen habe ich keine eigene Feed-Adresse gefunden (Destatis, Bundeswahlleiterin,
# BfDI, BMDS, Normenkontrollrat, IT-Planungsrat, Bitkom, Eurostat). Als Ersatz dient die
# Google-News-Suche mit site:-Filter. EXPERIMENTELL: Google News indexiert Behördenseiten nur
# teilweise. Das Protokoll zeigt je Quelle, wie viele Einträge ankommen; leere Quellen entfernen.
google_news:
  - {suche: "site:destatis.de", kategorie: Behörde, organisation: Destatis}
  - {suche: "site:bundeswahlleiterin.de", kategorie: Behörde, organisation: Bundeswahlleiterin}
  - {suche: "site:bfdi.bund.de", kategorie: Behörde, organisation: BfDI}
  - {suche: "site:bmds.bund.de", kategorie: Behörde, organisation: BMDS}
  - {suche: "site:normenkontrollrat.bund.de", kategorie: Behörde, organisation: Normenkontrollrat}
  - {suche: "site:it-planungsrat.de", kategorie: Behörde, organisation: IT-Planungsrat}
  - {suche: "site:bitkom.org", kategorie: Presse, organisation: Bitkom}
  # Allgemeine Suchen: das Medium wird aus dem Titel übernommen
  - {suche: '"Statistisches Bundesamt"', kategorie: Presse}
  - {suche: "Destatis", kategorie: Presse}
  - {suche: "Bundeswahlleiterin", kategorie: Presse}

# kategorie bestimmt das Excel-Blatt (Bundesregierung, Bundestag, Behörde, Europa, Presse, Personal);
# sie ist im Dashboard je Artikel änderbar. Ohne Angabe gilt „Presse“.

# Bewertung
bewertung:
  ki_aktiv: true              # false = nur Stichwortfilter
  anbieter: gemini            # gemini (Gratis-Kontingent) oder anthropic
  modell: gemini-3.5-flash-lite   # Modellnamen ändern sich. Für anthropic: claude-haiku-5-5
  modell_alternativen:            # wird der Name nicht gefunden (404), probiert das Tool diese der Reihe nach
    - gemini-2.5-flash-lite
    - gemini-2.5-flash
  pause_sekunden: 4           # Wartezeit zwischen KI-Anfragen (schont das Gratis-Limit)
  mindest_relevanz: 40        # 0-100; darunter wird der Artikel verworfen
  max_ki_pro_lauf: 40         # So viele neue Artikel pro Lauf höchstens an die KI; der Rest folgt im nächsten Lauf

# Aufbewahrung
behalten_tage: 30
