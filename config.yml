# Konfiguration des Medienmonitors – hier passen Sie alles an.

# Wofür wird beobachtet? (Wird der KI als Kontext gegeben.)
thema: >
  Monitoring für das Statistische Bundesamt (Destatis) einschließlich der Bundeswahlleiterin:
  amtliche Statistik und Bundesstatistik, Statistik- und Registergesetzgebung,
  Datenpolitik und Dateninfrastruktur, Registermodernisierung, Verwaltungs- und
  Staatsmodernisierung, Digitalisierung, Datenschutz, KI, relevante Akteure (Eurostat, OECD,
  Normenkontrollrat, IT-Planungsrat u. a.) sowie Wahlrecht, Wahlorganisation und Wahlstatistik.
  Relevant sind Meldungen, die diese Themen inhaltlich betreffen, nicht bloße Randerwähnungen.

# Suchbegriffe kommen aus der Excel-Datei (Spalte A: Themenfeld, Spalte B: Suchbegriff).
# Einfach die Datei im Repository ersetzen oder bearbeiten.
stichworte:
  datei: suchbegriffe.xlsx
  einschliessen: []      # optional zusätzliche Begriffe, z. B. {Themenfeld: [Begriff, ...]}
  ausschliessen: []      # Begriffe, die einen Artikel sofort aussortieren

max_volltext_pro_lauf: 80   # Obergrenze für Seitenabrufe pro Lauf

# Nur Artikel aus den letzten N Tagen werden aufgenommen.
max_alter_tage: 14

# Quellen. HINWEIS: Der hib-Feed enthält nur die letzten ~15 Meldungen (grob 2 Stunden bis
# ein Tag). Rückwirkend gibt es daher nur, was die Feeds gerade noch hergeben; der Rest
# baut sich ab dem ersten Lauf auf. Deshalb läuft der Workflow alle 30 Minuten.
feeds:
  - name: hib - heute im bundestag (alle)
    url: https://www.bundestag.de/static/appdata/includes/rss/hib.rss
    kategorie: Bundestag
    organisation: hib
    volltext: true   # Artikelseite laden: hib-Titel allein sind zu kurz für die Suche
  - name: hib - Digitales und Staatsmodernisierung
    url: https://www.bundestag.de/static/appdata/includes/rss/digitales.rss
    kategorie: Bundestag
    organisation: hib
    volltext: true   # Artikelseite laden: hib-Titel allein sind zu kurz für die Suche
  - name: hib - Inneres
    url: https://www.bundestag.de/static/appdata/includes/rss/inneres.rss
    kategorie: Bundestag
    organisation: hib
    volltext: true   # Artikelseite laden: hib-Titel allein sind zu kurz für die Suche
  - name: hib - Wahlprüfung, Immunität und Geschäftsordnung
    url: https://www.bundestag.de/static/appdata/includes/rss/wahlpruefung.rss
    kategorie: Bundestag
    organisation: hib
    volltext: true   # Artikelseite laden: hib-Titel allein sind zu kurz für die Suche
  # Weitere hib-Themenfeeds nach Bedarf einkommentieren:
  # - {name: "hib - Recht und Verbraucherschutz", url: "https://www.bundestag.de/static/appdata/includes/rss/recht.rss"}
  # - {name: "hib - Europäische Union", url: "https://www.bundestag.de/static/appdata/includes/rss/eu.rss"}
  - name: netzpolitik.org Ticker
    url: https://netzpolitik.org/ticker/feed
    kategorie: Presse
    organisation: netzpolitik.org
    seiten: 5      # liest zusätzlich ?paged=2…5 (WordPress-Paging, ungetestet); endet bei Fehler

