name: Medienmonitor

on:
  schedule:
    - cron: "7,37 * * * *"    # alle 30 Minuten
  workflow_dispatch:          # manueller Start über den Actions-Tab

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Feeds scannen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scanner/scan.py
      - name: Ergebnis speichern
        run: |
          git config user.name "medienmonitor-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data/articles.json
          git diff --staged --quiet || git commit -m "Update Artikel $(date -u +%F\ %H:%M)"
          git push
