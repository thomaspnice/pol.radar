<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Medienmonitor</title>
<style>
  :root { --bg:#f3f5f9; --card:#fff; --text:#18202e; --muted:#6a7487; --line:#e2e6ee; --shadow:0 1px 2px rgba(20,30,50,.06),0 4px 14px rgba(20,30,50,.04);
          --pos:#168a52; --neg:#c8372b; --neu:#8892a6; --accent:#2457d6; --accent-soft:#e8efff; --sel:#f0f5ff; --warn-bg:#fff4e0; --warn:#7a4b00; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1218; --card:#181d26; --text:#e8ebf1; --muted:#9aa4b8; --line:#272e3b; --shadow:none;
            --pos:#4cc38a; --neg:#ff7b6b; --neu:#9aa4b8; --accent:#7ea2ff; --accent-soft:#1d2740; --sel:#182238; --warn-bg:#3a2d12; --warn:#f3d9a4; } }
  * { box-sizing:border-box; }
  body { margin:0; font:15.5px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); }
  header, main { max-width:1000px; margin:0 auto; padding:18px 16px; }
  header { padding-bottom:4px; }
  h1 { font-size:1.55rem; margin:6px 0 2px; letter-spacing:-.01em; }
  h1::before { content:""; display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--accent); margin-right:10px; vertical-align:middle; box-shadow:0 0 0 4px var(--accent-soft); }
  .sub { color:var(--muted); font-size:.85rem; }
  .filters { display:flex; flex-wrap:wrap; gap:8px; margin:16px 0 8px; align-items:center; padding:12px; background:var(--card); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); }
  .filters input[type=search], .filters select, .ed input[type=text], .ed select, .ed textarea {
    padding:8px 11px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--text); font:inherit; font-size:.9rem; }
  .filters input[type=search], .filters select { transition:border-color .15s, box-shadow .15s; }
  .filters input:focus, .filters select:focus, .ed input:focus, .ed select:focus, .ed textarea:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  .filters input[type=search] { flex:1 1 240px; }
  .filters label { font-size:.88rem; display:flex; gap:6px; align-items:center; color:var(--muted); }
  .bar { position:sticky; top:0; z-index:5; background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(8px); padding:10px 0; display:flex; gap:10px; align-items:center;
         flex-wrap:wrap; border-bottom:1px solid var(--line); margin-bottom:14px; }
  #zaehler { font-weight:600; background:var(--accent-soft); color:var(--accent); padding:4px 12px; border-radius:999px; font-size:.88rem; }
  button { padding:8px 16px; border:1px solid var(--accent); background:var(--accent); color:#fff; border-radius:10px; font:inherit; font-size:.9rem; font-weight:500; cursor:pointer; transition:filter .15s, transform .05s; }
  button:hover:not(:disabled) { filter:brightness(1.1); } button:active:not(:disabled) { transform:translateY(1px); }
  button.sec { background:transparent; color:var(--accent); }
  button:disabled { opacity:.4; cursor:default; }
  .item { position:relative; background:var(--card); border:1px solid var(--line); border-left:4px solid var(--neu); border-radius:12px; padding:14px 16px; margin-bottom:12px; display:flex; gap:14px; box-shadow:var(--shadow); transition:border-color .15s, box-shadow .15s; }
  .item:hover { border-color:color-mix(in srgb, var(--accent) 40%, var(--line)); }
  .item.t-positiv { border-left-color:var(--pos); } .item.t-negativ { border-left-color:var(--neg); }
  .item.sel { background:var(--sel); border-color:var(--accent); border-left-color:var(--accent); }
  .item > input[type=checkbox] { margin-top:4px; width:19px; height:19px; flex:none; cursor:pointer; accent-color:var(--accent); }
  .body { flex:1; min-width:0; }
  .item a.t { color:var(--text); font-weight:650; font-size:1.02rem; line-height:1.35; text-decoration:none; }
  .item a.t:hover { color:var(--accent); }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:6px; align-items:center; }
  .chip { font-size:.72rem; font-weight:600; letter-spacing:.02em; text-transform:uppercase; padding:2px 9px; border-radius:999px; background:var(--accent-soft); color:var(--accent); }
  .chip.rel { background:transparent; border:1px solid var(--line); color:var(--muted); text-transform:none; }
  .chip.rel.hoch { border-color:var(--pos); color:var(--pos); }
  .meta { font-size:.8rem; color:var(--muted); margin-top:8px; display:flex; flex-wrap:wrap; gap:3px 14px; }
  .sum { margin:6px 0 0; font-size:.93rem; color:color-mix(in srgb, var(--text) 85%, var(--muted)); }
  .badge { font-weight:600; }
  .positiv { color:var(--pos); } .negativ { color:var(--neg); } .neutral, .unbewertet { color:var(--neu); }
  .ed { margin-top:12px; padding-top:12px; border-top:1px dashed var(--line); display:grid; gap:10px; grid-template-columns:1fr 1fr; }
  .ed .full { grid-column:1 / -1; }
  .ed label { font-size:.76rem; color:var(--muted); display:block; margin-bottom:3px; font-weight:500; }
  .ed input[type=text], .ed select, .ed textarea { width:100%; }
  .ed textarea { min-height:78px; resize:vertical; }
  .ed .chk { display:flex; gap:18px; align-items:center; font-size:.9rem; color:var(--text); }
  .ed .chk label { display:flex; gap:6px; align-items:center; font-size:.9rem; color:var(--text); margin:0; }
  .warn { background:var(--warn-bg); color:var(--warn); border-radius:10px; padding:9px 13px; font-size:.85rem; margin:10px 0 0; }
  .empty { text-align:center; color:var(--muted); padding:48px 0; }
  #quellen { margin-top:10px; font-size:13px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:8px 14px; box-shadow:var(--shadow); }
  #quellen summary { cursor:pointer; color:var(--accent); font-weight:600; }
  #quellen table { border-collapse:collapse; width:100%; margin-top:8px; }
  #quellen th { font-size:.72rem; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  #quellen th, #quellen td { text-align:left; padding:5px 8px; border-bottom:1px solid var(--line); }
  #quellen td.n { text-align:right; } #quellen .bad { color:var(--neg); } #quellen .zero { color:var(--muted); }
  @media (max-width:640px) { .ed { grid-template-columns:1fr; } #quellen { overflow-x:auto; } }
</style>
</head>
<body>
<header>
  <h1>Medienmonitor</h1>
  <div class="sub" id="stand">Lade …</div>
  <div class="filters">
    <input id="q" type="search" placeholder="Suchen in Titel und Zusammenfassung …">
    <select id="ton"><option value="">Alle Tonalitäten</option><option>positiv</option><option>neutral</option><option>negativ</option><option>unbewertet</option></select>
    <select id="feld"><option value="">Alle Themenfelder</option></select>
    <select id="quelle"><option value="">Alle Quellen</option></select>
    <select id="zeit"><option value="1">Letzte 24 h</option><option value="7">Letzte 7 Tage</option><option value="14" selected>Letzte 14 Tage</option><option value="30">Letzte 30 Tage</option></select>
    <select id="sort"><option value="datum">Neueste zuerst</option><option value="relevanz">Relevanteste zuerst</option></select>
    <label><input type="checkbox" id="nurSel"> nur ausgewählte</label>
  </div>
  <div id="fehler"></div>
  <details id="quellen"><summary id="quellenTitel">Quellenübersicht</summary><div id="quellenBody"></div></details>
</header>
<main>
  <div class="bar">
    <span id="zaehler">0 ausgewählt</span>
    <button id="export" disabled>Excel erstellen</button>
    <button id="leeren" class="sec" disabled>Auswahl leeren</button>
    <span class="sub" id="status"></span>
  </div>
  <div id="liste"></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="export.js"></script>
<script>
const KATEGORIEN = ["Bundesregierung", "Bundestag", "Behörde", "Europa", "Presse", "Personal"];
const $ = id => document.getElementById(id);
let alle = [];
let auswahl = {};                       // url -> bearbeitbarer Eintrag für den Excel-Export
const SPEICHER = "medienmonitor_auswahl_v1";

try { auswahl = JSON.parse(localStorage.getItem(SPEICHER) || "{}"); } catch { auswahl = {}; }
function speichern() { try { localStorage.setItem(SPEICHER, JSON.stringify(auswahl)); } catch {} zaehlerAktualisieren(); }

function sicherLink(u) { try { const p = new URL(u); return /^https?:$/.test(p.protocol) ? p.href : null; } catch { return null; } }
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function anriss(text, n = 2, max = 350) {
  const t = (text || "").replace(/\s+/g, " ").trim();
  const teile = t.split(/(?<=[.!?])\s+(?=[A-ZÄÖÜ„"(])/);
  let out = teile.slice(0, n).join(" ");
  if (out.length > max) out = out.slice(0, max).replace(/\s+\S*$/, "") + " …";
  return out;
}

function neuerEintrag(x) {
  return {
    url: x.url, datum: x.datum,
    kategorie: KATEGORIEN.includes(x.kategorie) ? x.kategorie : "Presse",
    organisation: x.organisation || x.quelle || "",
    titel: x.titel || "",
    erlaeuterung: x.zusammenfassung || anriss(x.auszug),
    stichwoerter: (x.treffer || []).join("; "),
    highlight: false, paywall: false,
  };
}

function feld(beschriftung, control, cls) {
  const d = el("div", cls || ""); d.append(el("label", null, beschriftung), control); return d;
}
function textfeld(e, key, tag = "input") {
  const c = tag === "textarea" ? el("textarea") : el("input"); if (tag === "input") c.type = "text";
  c.value = e[key] || "";
  c.addEventListener("input", () => { e[key] = c.value; speichern(); });
  return c;
}

function editor(e) {
  const box = el("div", "ed");
  const kat = el("select");
  for (const k of KATEGORIEN) { const o = el("option", null, k); o.value = k; kat.append(o); }
  kat.value = e.kategorie;
  const pay = el("label", null); const payBox = el("input"); payBox.type = "checkbox"; payBox.checked = !!e.paywall;
  payBox.addEventListener("change", () => { e.paywall = payBox.checked; speichern(); }); pay.append(payBox, " Paywall");
  const payWrap = el("span"); payWrap.append(pay); payWrap.style.display = e.kategorie === "Presse" ? "" : "none";
  kat.addEventListener("change", () => { e.kategorie = kat.value; payWrap.style.display = e.kategorie === "Presse" ? "" : "none"; speichern(); });
  box.append(feld("Blatt in der Excel-Datei", kat), feld("Organisation / Medium", textfeld(e, "organisation")));
  box.append(feld("Titel", textfeld(e, "titel"), "full"));
  box.append(feld("Erläuterung (Kurzzusammenfassung)", textfeld(e, "erlaeuterung", "textarea"), "full"));
  box.append(feld("Stichwörter", textfeld(e, "stichwoerter"), "full"));
  const hl = el("label"); const hlBox = el("input"); hlBox.type = "checkbox"; hlBox.checked = !!e.highlight;
  hlBox.addEventListener("change", () => { e.highlight = hlBox.checked; speichern(); }); hl.append(hlBox, " Highlight");
  const chk = el("div", "chk full"); chk.append(hl, payWrap); box.append(chk);
  return box;
}

function karte(x) {
  const gewaehlt = !!auswahl[x.url];
  const d = el("div", "item" + (gewaehlt ? " sel" : ""));
  const cb = el("input"); cb.type = "checkbox"; cb.checked = gewaehlt; cb.title = "In Excel übernehmen";
  cb.addEventListener("change", () => {
    if (cb.checked) auswahl[x.url] = neuerEintrag(x); else delete auswahl[x.url];
    speichern(); d.replaceWith(karte(x));
    if ($("nurSel").checked) render();
  });
  const body = el("div", "body");
  const chips = el("div", "chips");
  chips.append(el("span", "chip", KATEGORIEN.includes(x.kategorie) ? x.kategorie : "Presse"));
  if (x.relevanz != null) chips.append(el("span", "chip rel" + (x.relevanz >= 70 ? " hoch" : ""), "Relevanz " + x.relevanz));
  body.append(chips);
  if (x.tonalitaet === "positiv" || x.tonalitaet === "negativ") d.classList.add("t-" + x.tonalitaet);
  const link = sicherLink(x.url);
  const t = el(link ? "a" : "span", "t", x.titel || x.url);
  if (link) { t.href = link; t.target = "_blank"; t.rel = "noopener noreferrer"; }
  body.append(t);
  if (x.zusammenfassung) body.append(el("p", "sum", x.zusammenfassung));
  else if (x.auszug) body.append(el("p", "sum", anriss(x.auszug)));
  const m = el("div", "meta");
  m.append(el("span", null, new Date(x.datum).toLocaleString("de-DE", { dateStyle: "medium", timeStyle: "short" })));
  m.append(el("span", null, x.organisation ? x.organisation + " · " + x.quelle : x.quelle));
  if (x.themenfelder && x.themenfelder.length) m.append(el("span", null, "Themenfeld: " + x.themenfelder.join(", ")));
  if (x.treffer && x.treffer.length) m.append(el("span", null, "Begriffe: " + x.treffer.join(", ")));
  m.append(el("span", "badge " + x.tonalitaet, x.tonalitaet));
  body.append(m);
  if (gewaehlt) body.append(editor(auswahl[x.url]));
  d.append(cb, body);
  return d;
}

function render() {
  const q = $("q").value.toLowerCase(), ton = $("ton").value, qu = $("quelle").value, fe = $("feld").value;
  const grenze = Date.now() - Number($("zeit").value) * 864e5;
  const nurSel = $("nurSel").checked;
  let a = alle.filter(x =>
    (nurSel ? !!auswahl[x.url] : new Date(x.datum) >= grenze) &&
    (!ton || x.tonalitaet === ton) && (!qu || x.quelle === qu) && (!fe || (x.themenfelder || []).includes(fe)) &&
    (!q || (x.titel + " " + (x.zusammenfassung || "")).toLowerCase().includes(q)));
  if ($("sort").value === "relevanz") a.sort((x, y) => (y.relevanz ?? -1) - (x.relevanz ?? -1));
  const box = $("liste"); box.replaceChildren();
  if (!a.length) { box.append(el("div", "empty", "Keine Treffer für diese Filter.")); return; }
  for (const x of a) box.append(karte(x));
}

function zaehlerAktualisieren() {
  const n = Object.keys(auswahl).length;
  $("zaehler").textContent = n + (n === 1 ? " Artikel ausgewählt" : " Artikel ausgewählt");
  $("export").disabled = !n; $("leeren").disabled = !n;
}

$("leeren").addEventListener("click", () => {
  if (!confirm("Alle " + Object.keys(auswahl).length + " ausgewählten Artikel wieder abwählen?")) return;
  auswahl = {}; speichern(); render();
});

$("export").addEventListener("click", async () => {
  const st = $("status"); $("export").disabled = true; st.textContent = "Excel wird erstellt …";
  try {
    if (!window.ExcelJS) throw new Error("ExcelJS konnte nicht geladen werden (Internetverbindung prüfen).");
    const r = await fetch("vorlage.xlsx"); if (!r.ok) throw new Error("vorlage.xlsx nicht gefunden.");
    const buf = await Politikradar.erzeugeExcel(window.ExcelJS, await r.arrayBuffer(), Object.values(auswahl));
    const blob = new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = "politikradar_" + new Date().toISOString().slice(0, 10) + ".xlsx";
    document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    st.textContent = "Fertig: " + a.download;
  } catch (err) { st.textContent = "Fehler: " + err.message; }
  $("export").disabled = !Object.keys(auswahl).length;
});


function quellenUebersicht(q, artikel) {
  if (!q || !q.length) { $("quellen").style.display = "none"; return; }
  const anz = {}; for (const a of artikel) anz[a.quelle] = (anz[a.quelle] || 0) + 1;
  const kranke = q.filter(x => x.fehler).length;
  $("quellenTitel").textContent = "Quellenübersicht: " + q.length + " Quellen" + (kranke ? " · " + kranke + " mit Fehler" : "");
  const t = el("table"), h = el("tr");
  for (const c of ["Kategorie", "Organisation", "Quelle", "Art", "Filter", "Artikel im Bestand", "Letzter Lauf (neu / mit Begriff)", "Status"]) h.append(el("th", null, c));
  t.append(h);
  const ord = ["Bundesregierung", "Bundestag", "Behörde", "Europa", "Presse", "Personal"];
  for (const x of [...q].sort((a, b) => ord.indexOf(a.kategorie) - ord.indexOf(b.kategorie) || (a.organisation || "").localeCompare(b.organisation || ""))) {
    const r = el("tr");
    r.append(el("td", null, x.kategorie), el("td", null, x.organisation || ""));
    const tdn = el("td");
    if (x.url && /^https?:\/\//.test(x.url)) { const a = el("a", null, x.name); a.href = x.url; a.target = "_blank"; a.rel = "noopener"; tdn.append(a); } else tdn.textContent = x.name;
    r.append(tdn, el("td", null, x.art), el("td", null, x.streng ? "streng" : "normal"));
    r.append(el("td", "n", String(anz[x.name] || 0)), el("td", "n", x.letzter_lauf_neu + " / " + x.letzter_lauf_treffer));
    const zeit = x.zuletzt_ok ? new Date(x.zuletzt_ok).toLocaleString("de-DE") : "nie";
    r.append(x.fehler ? el("td", "bad", "Fehler: " + x.fehler) : el("td", (anz[x.name] || x.letzter_lauf_neu) ? null : "zero", "erreichbar (" + zeit + ")"));
    t.append(r);
  }
  $("quellenBody").replaceChildren(t);
}

fetch("data/articles.json", { cache: "no-store" }).then(r => r.json()).then(d => {
  alle = d.artikel || [];
  quellenUebersicht(d.quellen, alle);
  $("stand").textContent = "Stand: " + new Date(d.aktualisiert).toLocaleString("de-DE") + " · " + alle.length + " Artikel gespeichert";
  const fs = [...new Set(alle.flatMap(x => x.themenfelder || []))].sort();
  for (const f of fs) { const o = el("option", null, f); o.value = f; $("feld").append(o); }
  for (const s of [...new Set(alle.map(x => x.quelle))].sort()) { const o = el("option", null, s); o.value = s; $("quelle").append(o); }
  if (d.fehler && d.fehler.length) $("fehler").append(el("div", "warn", "Hinweise vom letzten Lauf: " + d.fehler.join(" | ")));
  // Ausgewählte Artikel, die aus dem Bestand gefallen sind, bleiben in der Auswahl und im Export.
  zaehlerAktualisieren(); render();
}).catch(() => { $("stand").textContent = "Noch keine Daten. Starten Sie den Workflow unter „Actions“."; zaehlerAktualisieren(); });

for (const id of ["q", "ton", "feld", "quelle", "zeit", "sort", "nurSel"]) $(id).addEventListener("input", render);
</script>
</body>
</html>
